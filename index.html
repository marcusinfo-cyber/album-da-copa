<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Álbum Copa 2026 — Controle de Figurinhas</title>
<style>
  :root{
    --verde-capa: #0b3d2e;
    --verde-capa2: #145c41;
    --dourado: #c9a23c;
    --dourado-claro: #e8cf8a;
    --creme: #f6f1e4;
    --creme2: #efe7d2;
    --tinta: #1d1a14;
    --tinta-suave: #4a4536;
    --vermelho: #b3392c;
    --azul-selo: #1f4e8c;
    --verde-ok: #2f7d4f;
    --sombra: 0 6px 18px rgba(20,15,5,.18);
    --borda: #d8cba3;
    --radius: 10px;
    --serif: "Source Serif 4","Georgia",serif;
    --display: "Bebas Neue","Oswald","Arial Narrow",sans-serif;
    --mono: "JetBrains Mono","Courier New",monospace;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--creme);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(11,61,46,.04), transparent 45%),
      radial-gradient(circle at 90% 10%, rgba(201,162,60,.07), transparent 40%);
    color: var(--tinta);
    font-family: var(--serif);
    -webkit-font-smoothing: antialiased;
  }

  @font-face{
    font-family: "Bebas Neue";
    src: local("Bebas Neue");
  }

  /* ===================== HEADER / CAPA ===================== */
  .capa{
    background:
      linear-gradient(160deg, var(--verde-capa) 0%, var(--verde-capa2) 55%, var(--verde-capa) 100%);
    color: var(--creme);
    padding: 28px 20px 34px;
    position: relative;
    overflow: hidden;
    border-bottom: 6px solid var(--dourado);
  }
  .capa::before{
    content:"";
    position:absolute; inset:0;
    background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.025) 0 2px, transparent 2px 14px);
    pointer-events:none;
  }
  .capa-inner{
    max-width: 1180px;
    margin: 0 auto;
    position: relative;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 24px;
    flex-wrap: wrap;
  }
  .capa-titulo{
    display:flex;
    flex-direction: column;
    gap: 4px;
  }
  .selo-eyebrow{
    font-family: var(--mono);
    letter-spacing: .22em;
    text-transform: uppercase;
    font-size: 11px;
    color: var(--dourado-claro);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .selo-eyebrow::before{
    content:"⚽";
  }
  .capa-titulo h1{
    font-family: var(--display);
    font-weight: 400;
    letter-spacing: .02em;
    font-size: clamp(34px, 5vw, 56px);
    margin: 0;
    line-height: .95;
    text-transform: uppercase;
  }
  .capa-titulo h1 span{ color: var(--dourado-claro); }
  .capa-sub{
    font-size: 14px;
    color: rgba(246,241,228,.78);
    max-width: 480px;
    margin-top: 2px;
  }

  .progress-box{
    background: rgba(0,0,0,.18);
    border: 1px solid rgba(232,207,138,.35);
    border-radius: var(--radius);
    padding: 16px 22px;
    min-width: 240px;
    backdrop-filter: blur(2px);
  }
  .progress-box .num{
    font-family: var(--display);
    font-size: 42px;
    line-height: 1;
    color: var(--dourado-claro);
  }
  .progress-box .num small{ font-size: 18px; color: rgba(246,241,228,.7); font-family: var(--serif); }
  .progress-box .label{
    font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    color: rgba(246,241,228,.6); margin-top: 2px;
  }
  .bar-track{
    margin-top: 10px;
    height: 8px;
    border-radius: 5px;
    background: rgba(255,255,255,.14);
    overflow: hidden;
  }
  .bar-fill{
    height: 100%;
    background: linear-gradient(90deg, var(--dourado) 0%, var(--dourado-claro) 100%);
    width: 0%;
    transition: width .4s ease;
  }

  /* ===================== TOOLBAR ===================== */
  .toolbar{
    position: sticky; top:0; z-index: 50;
    background: var(--creme2);
    border-bottom: 1px solid var(--borda);
    padding: 10px 20px;
    box-shadow: 0 2px 10px rgba(0,0,0,.05);
  }
  .toolbar-inner{
    max-width: 1180px; margin:0 auto;
    display:flex; align-items:center; gap:12px; flex-wrap: wrap;
  }
  .search-wrap{
    position: relative;
    flex: 1 1 240px;
    min-width: 200px;
  }
  .search-wrap input{
    width:100%;
    font-family: var(--serif);
    font-size: 14px;
    padding: 9px 12px 9px 34px;
    border-radius: 8px;
    border: 1px solid var(--borda);
    background: #fff;
    color: var(--tinta);
  }
  .search-wrap input:focus{ outline: 2px solid var(--azul-selo); outline-offset: 1px; }
  .search-wrap::before{
    content:"🔎";
    position:absolute; left:10px; top:50%; transform:translateY(-50%);
    font-size: 13px; opacity:.6;
  }
  .filter-pills{ display:flex; gap:6px; flex-wrap: wrap; }
  .pill{
    font-family: var(--mono);
    font-size: 11px; letter-spacing:.04em;
    padding: 7px 12px;
    border-radius: 999px;
    border: 1px solid var(--borda);
    background: #fff;
    color: var(--tinta-suave);
    cursor:pointer;
    transition: all .15s ease;
    white-space: nowrap;
  }
  .pill:hover{ border-color: var(--azul-selo); }
  .pill.active{
    background: var(--verde-capa);
    border-color: var(--verde-capa);
    color: var(--creme);
  }
  .toolbar-actions{ display:flex; gap:8px; margin-left:auto; }
  .btn{
    font-family: var(--serif);
    font-size: 13px;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 8px;
    border: 1px solid var(--borda);
    background:#fff;
    color: var(--tinta);
    cursor:pointer;
    display:inline-flex; align-items:center; gap:6px;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn:hover{ box-shadow: var(--sombra); transform: translateY(-1px); }
  .btn:active{ transform: translateY(0); }
  .btn-primary{
    background: var(--vermelho);
    border-color: var(--vermelho);
    color:#fff;
  }
  .btn-ghost{
    background: transparent;
  }

  /* ===================== CONTAINER ===================== */
  .wrap{ max-width: 1180px; margin: 0 auto; padding: 30px 20px 80px; }

  .group-block{ margin-bottom: 34px; }
  .group-head{
    display:flex; align-items: baseline; gap: 12px;
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--tinta);
  }
  .group-head .letra{
    font-family: var(--display);
    font-size: 30px;
    color: var(--vermelho);
    background: var(--dourado-claro);
    width: 38px; height:38px;
    border-radius: 6px;
    display:flex; align-items:center; justify-content:center;
    border: 2px solid var(--tinta);
  }
  .group-head .titulo-grupo{
    font-family: var(--display);
    font-size: 20px;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--tinta);
  }
  .group-head .grupo-progress{
    margin-left:auto;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--tinta-suave);
  }

  .teams-grid{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }
  @media (max-width: 760px){
    .teams-grid{ grid-template-columns: 1fr; }
  }

  .team-card{
    background:#fff;
    border: 1px solid var(--borda);
    border-radius: var(--radius);
    overflow:hidden;
    box-shadow: 0 1px 0 rgba(0,0,0,.02);
  }
  .team-head{
    display:flex; align-items:center; gap:10px;
    padding: 10px 14px;
    background: var(--creme2);
    border-bottom: 1px solid var(--borda);
  }
  .team-head .flag-chip{
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .04em;
    background: var(--verde-capa);
    color: var(--creme);
    padding: 3px 7px;
    border-radius: 4px;
  }
  .team-head .team-name{
    font-weight: 600;
    font-size: 14.5px;
    flex:1;
  }
  .team-head .team-count{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--tinta-suave);
  }

  .stickers-grid{
    display:grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 5px;
    padding: 12px;
  }
  @media (max-width: 480px){
    .stickers-grid{ grid-template-columns: repeat(5, 1fr); }
  }

  .sticker{
    aspect-ratio: 1 / 1;
    border: 1.5px dashed #b9ad84;
    border-radius: 5px;
    background: repeating-linear-gradient(135deg, #fdfbf4 0 6px, #f7f1df 6px 12px);
    display:flex; align-items:center; justify-content:center;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    color: var(--tinta-suave);
    cursor:pointer;
    user-select:none;
    position: relative;
    transition: transform .1s ease, box-shadow .1s ease;
  }
  .sticker:hover{ transform: translateY(-2px); box-shadow: 0 3px 8px rgba(0,0,0,.12); }
  .sticker:active{ transform: translateY(0) scale(.95); }
  .sticker.has{
    border-style: solid;
    border-color: var(--verde-ok);
    background: linear-gradient(160deg, #eafaf0, #d9f3e2);
    color: var(--verde-ok);
  }
  .sticker.has::after{
    content:"✓";
    position:absolute;
    top:-6px; right:-6px;
    width:16px; height:16px;
    background: var(--verde-ok);
    color:#fff;
    border-radius:50%;
    font-size: 10px;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 1px 3px rgba(0,0,0,.3);
  }
  .sticker.special{
    border-color: var(--dourado);
  }
  .sticker.hidden-by-filter{ display:none; }

  .special-section .team-head .flag-chip{ background: var(--vermelho); }

  /* ===================== FAB / RELATÓRIO ===================== */
  .fab-print{
    position: fixed;
    bottom: 22px; right: 22px;
    z-index: 60;
    background: var(--vermelho);
    color:#fff;
    border:none;
    border-radius: 999px;
    padding: 14px 22px;
    font-family: var(--serif);
    font-weight:700;
    font-size: 14px;
    box-shadow: 0 8px 20px rgba(179,57,44,.4);
    cursor:pointer;
    display:flex; align-items:center; gap:8px;
  }
  .fab-print:hover{ transform: translateY(-2px); }

  footer.rodape{
    text-align:center;
    padding: 30px 20px 50px;
    color: var(--tinta-suave);
    font-size: 12px;
  }

  /* ===================== TOAST ===================== */
  .toast{
    position: fixed; bottom: 90px; right: 22px;
    background: var(--tinta); color:#fff;
    padding: 10px 16px; border-radius: 8px;
    font-size: 13px;
    opacity:0; transform: translateY(8px);
    transition: all .25s ease;
    pointer-events:none;
    z-index: 70;
  }
  .toast.show{ opacity:1; transform: translateY(0); }

  /* ===================== RELATÓRIO IMPRIMÍVEL (escondido na tela) ===================== */
  #relatorio{ display:none; }

  @media print{
    html, body{
      height: auto !important;
      margin:0 !important; padding:0 !important;
      background: #fff !important;
      overflow: hidden !important;
    }
    body > *:not(#relatorio){ display:none !important; }
    #relatorio{
      display:block !important;
      position: static !important;
      width:100%;
      height: auto !important;
    }
    @page{ size: A4 landscape; margin: 8mm; }
  }

  .rel-page{
    width: 281mm;
    height: 190mm;
    font-family: Arial, Helvetica, sans-serif;
    color:#111;
    overflow: hidden;
  }
  .rel-titulo{
    background: var(--verde-capa);
    color:#fff;
    padding: 6px 10px;
    font-size: 15px;
    font-weight:bold;
    text-align:center;
    margin-bottom: 6px;
  }
  .rel-cols{
    column-count: 6;
    column-gap: 8px;
    height: 178mm;
    column-fill: auto;
  }
  .rel-team{
    break-inside: avoid;
    margin-bottom: 7px;
  }
  .rel-team-head{
    background: var(--azul-selo);
    color:#fff;
    font-size: 9.5px;
    font-weight:bold;
    padding: 2px 5px;
  }
  .rel-codes{
    font-size: 9px;
    padding: 2px 4px 0;
    line-height: 1.5;
  }
</style>
</head>

      <h1>Álbum <span>Copa 2026</span></h1>

  </div>
</header>

<div class="toolbar">

    </div>
    <div class="toolbar-actions">
      <button class="btn btn-ghost" id="btnLimpar">Limpar tudo</button>
      <button class="btn btn-primary" id="btnRelatorio">🖨️ Relatório p/ imprimir</button>
    </div>
  </div>
</div>

<main class="wrap" id="albumRoot"></main>

<footer class="rodape">Feito para acompanhar a coleção do álbum Panini Copa do Mundo FIFA 2026™ · uso pessoal</footer>

<div class="toast" id="toast"></div>

<div id="relatorio"></div>

<script>
(function(){
  const DATA = JSON.parse(document.getElementById('album-data').textContent);
  const STORAGE_KEY = 'album_copa2026_v1';

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return new Set(JSON.parse(raw));
    }catch(e){}
    // primeira vez: usar pre-marcados
    return new Set(DATA.preMarked);
  }
  let owned = loadState();
  let firstRun = !localStorage.getItem(STORAGE_KEY);

  function saveState(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(owned)));
  }

  function allCodes(){
    const list = [];
    DATA.groups.forEach(g => g.teams.forEach(t => {
      for(let n=1;n<=t.count;n++) list.push(`${t.code}-${n}`);
    }));
    for(let n=1;n<=DATA.fwc.count;n++) list.push(`FWC-${n}`);
    for(let n=1;n<=DATA.cc.count;n++) list.push(`CC-${n}`);
    return list;
  }
  const TOTAL = allCodes().length;

  function updateProgress(){
    const owned_total = Array.from(owned).filter(c => allCodesSet.has(c)).length;
    document.getElementById('contagem').innerHTML = `${owned_total}<small>/${TOTAL}</small>`;
    document.getElementById('barFill').style.width = (owned_total/TOTAL*100).toFixed(1) + '%';
  }
  const allCodesSet = new Set(allCodes());

  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._tm);
    toast._tm = setTimeout(()=>t.classList.remove('show'), 1800);
  }

  // ===== Render =====
  const root = document.getElementById('albumRoot');

  function buildStickerCell(code, label){
    const div = document.createElement('div');
    div.className = 'sticker';
    div.dataset.code = code;
    div.textContent = label;
    if(owned.has(code)) div.classList.add('has');
    div.addEventListener('click', () => {
      if(owned.has(code)){ owned.delete(code); div.classList.remove('has'); }
      else { owned.add(code); div.classList.add('has'); }
      saveState();
      updateProgress();
      updateGroupCounters();
      applyFilters();
    });
    return div;
  }

  function buildTeamCard(team){
    const card = document.createElement('div');
    card.className = 'team-card';
    card.dataset.teamCode = team.code;
    card.dataset.teamName = team.name.toLowerCase();

    const head = document.createElement('div');
    head.className = 'team-head';
    head.innerHTML = `<span class="flag-chip">${team.code}</span><span class="team-name">${team.name}</span><span class="team-count" data-count-for="${team.code}"></span>`;
    card.appendChild(head);

    const grid = document.createElement('div');
    grid.className = 'stickers-grid';
    for(let n=1;n<=team.count;n++){
      const code = `${team.code}-${n}`;
      grid.appendChild(buildStickerCell(code, n));
    }
    card.appendChild(grid);
    return card;
  }

  DATA.groups.forEach(group => {
    const block = document.createElement('section');
    block.className = 'group-block';

    const head = document.createElement('div');
    head.className = 'group-head';
    head.innerHTML = `<div class="letra">${group.letter}</div><div class="titulo-grupo">Grupo ${group.letter}</div><div class="grupo-progress" data-group-progress="${group.letter}"></div>`;
    block.appendChild(head);

    const grid = document.createElement('div');
    grid.className = 'teams-grid';
    group.teams.forEach(team => grid.appendChild(buildTeamCard(team)));
    block.appendChild(grid);

    root.appendChild(block);
  });

  // Secao especial: FWC + CC
  const specialBlock = document.createElement('section');
  specialBlock.className = 'group-block special-section';
  specialBlock.innerHTML = `<div class="group-head"><div class="letra">★</div><div class="titulo-grupo">Especiais</div><div class="grupo-progress" data-group-progress="ESPECIAIS"></div></div>`;
  const specialGrid = document.createElement('div');
  specialGrid.className = 'teams-grid';

  const fwcCard = document.createElement('div');
  fwcCard.className = 'team-card';
  fwcCard.dataset.teamCode = 'FWC';
  fwcCard.dataset.teamName = DATA.fwc.name.toLowerCase();
  fwcCard.innerHTML = `<div class="team-head"><span class="flag-chip">FWC</span><span class="team-name">${DATA.fwc.name}</span><span class="team-count" data-count-for="FWC"></span></div>`;
  const fwcGrid = document.createElement('div');
  fwcGrid.className = 'stickers-grid';
  for(let n=1;n<=DATA.fwc.count;n++){
    const cell = buildStickerCell(`FWC-${n}`, n);
    cell.classList.add('special');
    fwcGrid.appendChild(cell);
  }
  fwcCard.appendChild(fwcGrid);
  specialGrid.appendChild(fwcCard);

  const ccCard = document.createElement('div');
  ccCard.className = 'team-card';
  ccCard.dataset.teamCode = 'CC';
  ccCard.dataset.teamName = DATA.cc.name.toLowerCase();
  ccCard.innerHTML = `<div class="team-head"><span class="flag-chip">CC</span><span class="team-name">${DATA.cc.name}</span><span class="team-count" data-count-for="CC"></span></div>`;
  const ccGrid = document.createElement('div');
  ccGrid.className = 'stickers-grid';
  for(let n=1;n<=DATA.cc.count;n++){
    const cell = buildStickerCell(`CC-${n}`, n);
    cell.classList.add('special');
    ccGrid.appendChild(cell);
  }
  ccCard.appendChild(ccGrid);
  specialGrid.appendChild(ccCard);

  specialBlock.appendChild(specialGrid);
  root.appendChild(specialBlock);

  // ===== Contadores por time / grupo =====
  function updateGroupCounters(){
    DATA.groups.forEach(group => {
      let have = 0, total = 0;
      group.teams.forEach(team => {
        let h=0;
        for(let n=1;n<=team.count;n++){ total++; if(owned.has(`${team.code}-${n}`)){h++; have++;} }
        const elT = document.querySelector(`[data-count-for="${team.code}"]`);
        if(elT) elT.textContent = `${h}/${team.count}`;
      });
      const elG = document.querySelector(`[data-group-progress="${group.letter}"]`);
      if(elG) elG.textContent = `${have}/${total}`;
    });
    // especiais
    let hFwc=0; for(let n=1;n<=DATA.fwc.count;n++) if(owned.has(`FWC-${n}`)) hFwc++;
    let hCc=0; for(let n=1;n<=DATA.cc.count;n++) if(owned.has(`CC-${n}`)) hCc++;
    const elFwc = document.querySelector(`[data-count-for="FWC"]`);
    if(elFwc) elFwc.textContent = `${hFwc}/${DATA.fwc.count}`;
    const elCc = document.querySelector(`[data-count-for="CC"]`);
    if(elCc) elCc.textContent = `${hCc}/${DATA.cc.count}`;
    const elEsp = document.querySelector(`[data-group-progress="ESPECIAIS"]`);
    if(elEsp) elEsp.textContent = `${hFwc+hCc}/${DATA.fwc.count+DATA.cc.count}`;
  }

  // ===== Filtros =====
  let currentFilter = 'todas';
  let currentSearch = '';

  function applyFilters(){
    document.querySelectorAll('.team-card').forEach(card => {
      const teamName = card.dataset.teamName;
      const teamCode = card.dataset.teamCode.toLowerCase();
      const matchesSearch = !currentSearch ||
        teamName.includes(currentSearch) ||
        teamCode.includes(currentSearch);

      let anyVisible = false;
      card.querySelectorAll('.sticker').forEach(st => {
        const code = st.dataset.code.toLowerCase();
        const has = owned.has(st.dataset.code);
        let showByFilter = true;
        if(currentFilter === 'faltam') showByFilter = !has;
        if(currentFilter === 'tenho') showByFilter = has;

        let showBySearch = matchesSearch || code.includes(currentSearch);

        const show = showByFilter && showBySearch;
        st.classList.toggle('hidden-by-filter', !show);
        if(show) anyVisible = true;
      });
      card.style.display = anyVisible ? '' : 'none';
    });

    document.querySelectorAll('.group-block').forEach(block => {
      const visibleCards = Array.from(block.querySelectorAll('.team-card')).some(c => c.style.display !== 'none');
      block.style.display = visibleCards ? '' : 'none';
    });
  }

  document.querySelectorAll('.pill').forEach(p => {
    p.addEventListener('click', () => {
      document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
      p.classList.add('active');
      currentFilter = p.dataset.filter;
      applyFilters();
    });
  });

  document.getElementById('searchInput').addEventListener('input', (e) => {
    currentSearch = e.target.value.trim().toLowerCase();
    applyFilters();
  });

  document.getElementById('btnLimpar').addEventListener('click', () => {
    if(confirm('Tem certeza que quer apagar TODAS as marcações? Essa ação não pode ser desfeita.')){
      owned = new Set();
      saveState();
      document.querySelectorAll('.sticker').forEach(s => s.classList.remove('has'));
      updateProgress();
      updateGroupCounters();
      toast('Tudo limpo. Comece sua coleção do zero!');
    }
  });

  // ===== Relatório de impressão =====
  function buildRelatorio(){
    const container = document.getElementById('relatorio');
    container.innerHTML = '';

    const faltantes = []; // {header, codes:[labels]}
    DATA.groups.forEach(g => g.teams.forEach(team => {
      const codes = [];
      for(let n=1;n<=team.count;n++){
        const code = `${team.code}-${n}`;
        if(!owned.has(code)) codes.push(`${team.code}${n}`);
      }
      if(codes.length) faltantes.push({header:`${team.name} (${team.code})`, codes});
    }));
    {
      const codes = [];
      for(let n=1;n<=DATA.fwc.count;n++){ if(!owned.has(`FWC-${n}`)) codes.push(`FWC${n}`); }
      if(codes.length) faltantes.push({header:DATA.fwc.name, codes});
    }
    {
      const codes = [];
      for(let n=1;n<=DATA.cc.count;n++){ if(!owned.has(`CC-${n}`)) codes.push(`CC${n}`); }
      if(codes.length) faltantes.push({header:DATA.cc.name, codes});
    }

    const totalFaltam = faltantes.reduce((a,b)=>a+b.codes.length,0);
    const totalTenho = TOTAL - totalFaltam;
    const dataStr = new Date().toLocaleDateString('pt-BR');

    const page = document.createElement('div');
    page.className = 'rel-page';

    const titulo = document.createElement('div');
    titulo.className = 'rel-titulo';
    titulo.textContent = `FIGURINHAS QUE FALTAM — ÁLBUM COPA 2026  (${totalFaltam} de ${TOTAL}  |  você já tem ${totalTenho})  •  Gerado em ${dataStr}`;
    page.appendChild(titulo);

    const cols = document.createElement('div');
    cols.className = 'rel-cols';

    faltantes.forEach(item => {
      const teamDiv = document.createElement('div');
      teamDiv.className = 'rel-team';
      const h = document.createElement('div');
      h.className = 'rel-team-head';
      h.textContent = `${item.header}  (${item.codes.length})`;
      teamDiv.appendChild(h);
      const c = document.createElement('div');
      c.className = 'rel-codes';
      c.textContent = item.codes.join('  ');
      teamDiv.appendChild(c);
      cols.appendChild(teamDiv);
    });

    page.appendChild(cols);
    container.appendChild(page);
  }

  document.getElementById('btnRelatorio').addEventListener('click', () => {
    if(TOTAL - Array.from(owned).filter(c=>allCodesSet.has(c)).length === 0){
      toast('Você já tem todas as figurinhas! 🎉');
      return;
    }
    buildRelatorio();
    setTimeout(() => window.print(), 80);
  });

  // ===== Init =====
  updateProgress();
  updateGroupCounters();
  applyFilters();
  if(firstRun && owned.size > 0){
    saveState();
    toast(`Carregamos ${owned.size} figurinhas que você já tinha marcado!`);
  }
})();
</script>

</body>
